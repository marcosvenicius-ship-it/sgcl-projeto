<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGCL — Gestão de Leads e Funil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container-fluid max-w-container py-4">
        <header
            class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-4 p-4 card border-0">
            <div>
                <div class="d-flex align-items-center gap-2 mb-1">
                    <h2 class="fw-bold text-dark mb-0 fs-4">SGCL — Gestão de Oportunidades</h2>
                </div>
                <p class="text-secondary mb-0 fs-6">Pipeline Comercial • Quadro Kanban e Filtros de Captação</p>
            </div>
        </header>

        <div class="card border-0 p-3 mb-4">
            <div class="row g-3 align-items-center">
                <div class="col-md-4">
                    <label for="filtroEtapa" class="form-label fw-semibold fs-7 mb-1 text-muted">FILTRAR POR
                        ETAPA</label>
                    <select id="filtroEtapa" class="form-select" onchange="aplicarFiltros()">
                        <option value="TODAS">Todas as Etapas</option>
                        <option value="NOVO">Novo</option>
                        <option value="QUALIFICACAO">Qualificação</option>
                        <option value="PROPOSTA">Proposta</option>
                        <option value="NEGOCIACAO">Negociação</option>
                        <option value="FECHAMENTO">Fechamento</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="filtroOrigem" class="form-label fw-semibold fs-7 mb-1 text-muted">FILTRAR POR CANAL DE
                        CAPTAÇÃO</label>
                    <select id="filtroOrigem" class="form-select" onchange="aplicarFiltros()">
                        <option value="TODOS">Todos os Canais</option>
                        <option value="SITE">Site Institucional</option>
                        <option value="RD_STATION">Marketing</option>
                        <option value="INDICACAO">Indicação Comercial</option>
                        <option value="EVENTO">Feira / Evento</option>
                        <option value="OUTRO">Outro Canal</option>
                    </select>
                </div>
                <div class="col-md-4 d-flex align-items-end justify-content-md-end">
                    <button onclick="carregarProspects()"
                        class="btn btn-light border fw-semibold w-100 w-md-auto mt-3 mt-md-0">
                        ↻ Atualizar Dados
                    </button>
                </div>
            </div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-lg-4">
                <div class="card border-0">
                    <div class="card-header bg-white py-3 border-bottom">
                        <h5 class="card-title mb-0 fs-6 fw-bold text-dark">Cadastrar Prospect</h5>
                    </div>
                    <div class="card-body p-4">
                        <form id="formProspect">
                            <div class="mb-3">
                                <label for="nome" class="form-label fw-semibold">Nome Completo <span
                                        class="text-danger">*</span></label>
                                <input type="text" id="nome" class="form-control" placeholder="Ex: Marcos Venicius"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">E-mail Corporativo <span
                                        class="text-danger">*</span></label>
                                <input type="email" id="email" class="form-control" placeholder="marcos@empresa.com.br"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="telefone" class="form-label fw-semibold">Telefone / WhatsApp <span
                                        class="text-danger">*</span></label>
                                <input type="text" id="telefone" class="form-control" placeholder="(11) 98765-4321"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="empresa" class="form-label fw-semibold">Empresa</label>
                                <input type="text" id="empresa" class="form-control" placeholder="Nome da empresa">
                            </div>

                            <div class="mb-3">
                                <label for="cnpj" class="form-label fw-semibold">CNPJ</label>
                                <input type="text" id="cnpj" class="form-control" placeholder="00.000.000/0001-00">
                            </div>

                            <div class="mb-3">
                                <label for="origem" class="form-label fw-semibold">Canal de Origem <span
                                        class="text-danger">*</span></label>
                                <select id="origem" class="form-select" required>
                                    <option value="" disabled selected>Selecione o canal...</option>
                                    <option value="SITE">Site Institucional</option>
                                    <option value="RD_STATION">Marketing</option>
                                    <option value="INDICACAO">Indicação Comercial</option>
                                    <option value="EVENTO">Feira / Evento</option>
                                    <option value="OUTRO">Outro Canal</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="etapaFunil" class="form-label fw-semibold">Estágio Inicial <span
                                        class="text-danger">*</span></label>
                                <select id="etapaFunil" class="form-select" required>
                                    <option value="NOVO" selected>Novo</option>
                                    <option value="QUALIFICACAO">Qualificação</option>
                                    <option value="PROPOSTA">Proposta</option>
                                    <option value="NEGOCIACAO">Negociação</option>
                                    <option value="FECHAMENTO">Fechamento</option>
                                </select>
                            </div>

                            <button type="submit" id="btnSalvar" class="btn btn-indigo w-100 fw-bold py-2 mt-2">
                                Cadastrar Prospect
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card border-0">
                    <div class="card-header bg-white py-3 border-bottom">
                        <h5 class="card-title mb-0 fs-6 fw-bold text-dark">Base Cadastral de Prospects</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Contato</th>
                                        <th>Empresa / CNPJ</th>
                                        <th>Origem</th>
                                        <th>Estágio</th>
                                        <th class="text-center">Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelaProspects">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mb-4">
            <h5 class="fw-bold mb-3 text-dark">Pipeline Comercial (Quadro de Estágios)</h5>
            <div class="row g-3" id="kanbanBoard">
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0">
                <div class="modal-header border-bottom">
                    <h5 class="modal-title fw-bold">Transição de Estágio / Edição</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formEditarProspect">
                        <input type="hidden" id="editId">

                        <div class="mb-3">
                            <label for="editNome" class="form-label fw-semibold">Nome Completo</label>
                            <input type="text" id="editNome" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="editEmail" class="form-label fw-semibold">E-mail Corporativo</label>
                            <input type="email" id="editEmail" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="editTelefone" class="form-label fw-semibold">Telefone / WhatsApp</label>
                            <input type="text" id="editTelefone" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="editEmpresa" class="form-label fw-semibold">Empresa</label>
                            <input type="text" id="editEmpresa" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label for="editCnpj" class="form-label fw-semibold">CNPJ</label>
                            <input type="text" id="editCnpj" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label for="editOrigem" class="form-label fw-semibold">Canal de Origem</label>
                            <select id="editOrigem" class="form-select" required>
                                <option value="SITE">Site Institucional</option>
                                <option value="RD_STATION">Marketing</option>
                                <option value="INDICACAO">Indicação Comercial</option>
                                <option value="EVENTO">Feira / Evento</option>
                                <option value="OUTRO">Outro Canal</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="editEtapaFunil" class="form-label fw-semibold">Estágio do Funil</label>
                            <select id="editEtapaFunil" class="form-select" required>
                                <option value="NOVO">Novo</option>
                                <option value="QUALIFICACAO">Qualificação</option>
                                <option value="PROPOSTA">Proposta</option>
                                <option value="NEGOCIACAO">Negociação</option>
                                <option value="FECHAMENTO">Fechamento</option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <button type="button" class="btn btn-light border fw-semibold"
                                data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-indigo fw-bold">Salvar e Transicionar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
