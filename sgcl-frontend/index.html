<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGCL — Gestão de Leads</title>
    <!-- Bootstrap 5 para layout responsivo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilo Customizado -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container py-4">
        <!-- Cabeçalho da Aplicação -->
        <header
            class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-4 pb-3 border-bottom">
            <div>
                <h2 class="fw-bold mb-1 text-dark">SGCL — Gestão de Oportunidades</h2>
                <p class="text-secondary mb-0 fs-6">Painel Operacional de Captação e Rastreamento Comercial</p>
            </div>
            <div class="mt-2 mt-md-0">
                <span class="badge bg-light text-dark border px-3 py-2 fw-semibold">
                    Versão 1.0 • Módulo de Entrada
                </span>
            </div>
        </header>

        <div class="row g-4">
            <!-- Formulário de Cadastro de Prospect -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header card-header-custom py-3">
                        <h5 class="card-title mb-0 fs-6 fw-bold">Novo Prospect</h5>
                    </div>
                    <div class="card-body p-4">
                        <form id="formProspect">
                            <div class="mb-3">
                                <label for="nome" class="form-label fw-semibold">Nome Completo <span
                                        class="text-danger">*</span></label>
                                <input type="text" id="nome" class="form-control" placeholder="Ex: Marcos Venicius"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">E-mail Corporativo <span
                                        class="text-danger">*</span></label>
                                <input type="email" id="email" class="form-control" placeholder="marcos@empresa.com.br"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="telefone" class="form-label fw-semibold">Telefone / WhatsApp <span
                                        class="text-danger">*</span></label>
                                <input type="text" id="telefone" class="form-control" placeholder="(11) 98765-4321"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="empresa" class="form-label fw-semibold">Empresa</label>
                                <input type="text" id="empresa" class="form-control" placeholder="Nome da empresa">
                            </div>

                            <div class="mb-3">
                                <label for="cnpj" class="form-label fw-semibold">CNPJ</label>
                                <input type="text" id="cnpj" class="form-control" placeholder="00.000.000/0001-00">
                            </div>

                            <div class="mb-3">
                                <label for="origem" class="form-label fw-semibold">Canal de Origem <span
                                        class="text-danger">*</span></label>
                                <select id="origem" class="form-select" required>
                                    <option value="" disabled selected>Selecione o canal...</option>
                                    <option value="SITE">Site Institucional</option>
                                    <option value="RD_STATION">Marketing</option>
                                    <option value="INDICACAO">Indicação Comercial</option>
                                    <option value="EVENTO">Feira / Evento</option>
                                    <option value="OUTRO">Outro Canal</option>
                                </select>
                            </div>

                            <button type="submit" id="btnSalvar" class="btn btn-primary w-100 fw-bold py-2 mt-2">
                                Cadastrar Prospect
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabela de Listagem de Prospects -->
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0 fs-6 fw-bold text-dark">Prospects Registrados no Sistema</h5>
                        <button onclick="carregarProspects()" class="btn btn-sm btn-outline-secondary">
                            ↻ Atualizar
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Contato</th>
                                        <th>Telefone</th>
                                        <th>Empresa / CNPJ</th>
                                        <th>Origem</th>
                                        <th>Etapa</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelaProspects">
                                    <!-- Conteúdo injetado dinamicamente pelo JavaScript -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Integração -->
    <script src="app.js"></script>
</body>

</html>
